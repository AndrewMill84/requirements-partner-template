name: Requirements checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Test validator, measurement CLI and evaluation dataset
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository structure
        run: python3 scripts/validate_requirements.py
      - name: Validate workflow observations
        run: python3 scripts/measure_workflow.py --check
      - name: Summarize workflow observation coverage
        run: python3 scripts/measure_workflow.py
